        (function () {
            function show(msg) {
                var d = document.getElementById('boot-err');
                if (!d) {
                    d = document.createElement('div');
                    d.id = 'boot-err';

                    (document.body || document.documentElement).appendChild(d);
                }
                d.textContent += msg + '\n';
            }
            window.onerror = function (m, src, line) { show('Error: ' + m + ' (' + src + ':' + line + ')'); };
            // Capture phase: resource load errors (<script>/<img>) don't bubble and never reach onerror.
            window.addEventListener('error', function (e) {
                var t = e.target;
                if (t && t !== window && (t.src || t.href)) show('Failed to load: ' + (t.src || t.href));
            }, true);
            window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && e.reason.message || e.reason)); });

            // Phaser ignores events that are already defaultPrevented, so we must step aside.
            window.addEventListener('keydown', function (e) {
                if (window.__booted) return;
                if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
            });
        })();

\u0417\u0410\u041A\u0420\u0418\u0422\u0418\u0419 \u0414\u041E\u0411\u0406\u0420. \u0422\u043E\u0439, \u0445\u0442\u043E \u043F\u0440\u043E\u0433\u0440\u0430\u0432, \u0434\u043E\u0431\u0438\u0440\u0430\u0454 \u0437 \u043A\u043E\u043B\u043E\u0434\u0438 \u0437\u0430\u043A\u0440\u0438\u0442\u0456 \u043A\u0430\u0440\u0442\u0438 \u043B\u0430\u043D\u0446\u044E\u0436\u043A\u043E\u043C: \u043F\u043E\u043A\u0438 \u0432\u0438\u043F\u0430\u0434\u0430\u0454 \u0432\u043E\u0457\u043D, \u0449\u043E \u0437\u0431\u0456\u0433\u0430\u0454\u0442\u044C\u0441\u044F \u0437 \u043F\u043E\u043F\u0435\u0440\u0435\u0434\u043D\u0456\u043C \u0432\u043E\u0457\u043D\u043E\u043C \u0437\u0430 \u0442\u0438\u043F\u043E\u043C \u0430\u0431\u043E \u043A\u043E\u043B\u044C\u043E\u0440\u043E\u043C, \u0430 \u0442\u0430\u043A\u043E\u0436 \u0431\u0443\u0434\u044C-\u044F\u043A\u0430 \u0413\u0435\u0439\u0448\u0430 \u0447\u0438 \u0428\u0438\u043D\u043E\u0431\u0456, \u0434\u043E\u0431\u0456\u0440 \u0442\u0440\u0438\u0432\u0430\u0454. \u041F\u0435\u0440\u0448\u0438\u0439 \u0432\u043E\u0457\u043D, \u0449\u043E \u043D\u0435 \u043F\u0456\u0434\u0456\u0439\u0448\u043E\u0432, \u0437\u0443\u043F\u0438\u043D\u044F\u0454 \u0434\u043E\u0431\u0456\u0440 \u0456 \u043B\u044F\u0433\u0430\u0454 \u043D\u0430 \u0432\u0435\u0440\u0445 \u043A\u043E\u043B\u043E\u0434\u0438. \u0422\u043E\u043C\u0443 \u043F\u0440\u043E\u0433\u0440\u0430\u0442\u0438 \u0456\u043D\u043E\u0434\u0456 \u0432\u0438\u0433\u0456\u0434\u043D\u043E: \u0437\u0430\u043A\u0440\u0438\u0442\u0438\u0445 \u043A\u0430\u0440\u0442 \u043C\u043E\u0436\u0435 \u0431\u0443\u0442\u0438 \u043A\u0456\u043B\u044C\u043A\u0430.

\u0413\u0415\u0419\u0428\u0410 \u0439 \u0428\u0418\u041D\u041E\u0411\u0406. \u0413\u0435\u0439\u0448\u0430 \u0440\u0430\u0437\u043E\u043C \u0456\u0437 \u043E\u0431\u0440\u0430\u043D\u043E\u044E \u043A\u0430\u0440\u0442\u043E\u044E \u0441\u0443\u043F\u0435\u0440\u043D\u0438\u043A\u0430 (\u0432\u0456\u0434\u043A\u0440\u0438\u0442\u043E\u044E \u0447\u0438 \u0437\u0430\u043A\u0440\u0438\u0442\u043E\u044E) \u0439\u0434\u0435 \u0443 \u0441\u043A\u0438\u0434. \u0428\u0438\u043D\u043E\u0431\u0456 \u043A\u0440\u0430\u0434\u0435 \u043E\u0434\u043D\u0443 \u043A\u0430\u0440\u0442\u0443 \u0441\u0443\u043F\u0435\u0440\u043D\u0438\u043A\u0430, \u0430 \u0441\u0430\u043C\u0430 \u043F\u0435\u0440\u0435\u0445\u043E\u0434\u0438\u0442\u044C \u0434\u043E \u043D\u044C\u043E\u0433\u043E \u0439 \u0440\u0430\u0445\u0443\u0454\u0442\u044C\u0441\u044F \u0432 \u043D\u044C\u043E\u0433\u043E. \u0421\u043F\u0435\u0446\u043A\u0430\u0440\u0442\u0438 \u0440\u043E\u0437\u0456\u0433\u0440\u0443\u044E\u0442\u044C \u043F\u043E \u0447\u0435\u0440\u0437\u0456 \u0434\u043E \u043F\u0430\u0441\u0430 \u043E\u0431\u043E\u0445.

\u0412\u0418\u0420\u0406\u0412\u041D\u042E\u0412\u0410\u041D\u041D\u042F. \u041F\u0435\u0440\u0435\u0434 \u0431\u0438\u0442\u0432\u043E\u044E \u0442\u043E\u0439, \u0443 \u043A\u043E\u0433\u043E \u043C\u0435\u043D\u0448\u0435 \u0432\u0456\u0434\u043A\u0440\u0438\u0442\u0438\u0445 \u0432\u043E\u0457\u043D\u0456\u0432, \u0432\u0456\u0434\u043A\u0440\u0438\u0432\u0430\u0454 \u0437\u0430\u043A\u0440\u0438\u0442\u0456 \u0434\u043E \u0440\u0456\u0432\u043D\u043E\u0441\u0442\u0456. \u0414\u0430\u043B\u0456 \u043E\u0431\u0438\u0434\u0432\u0430 \u043C\u043E\u0436\u0443\u0442\u044C \u0434\u043E\u043A\u043B\u0430\u0441\u0442\u0438 \u0449\u0435. \u0417\u0430\u043A\u0440\u0438\u0442\u0456 \u0432\u043E\u0457\u043D\u0438, \u0449\u043E \u043B\u0438\u0448\u0438\u043B\u0438\u0441\u044F, \u2014 \u0440\u0435\u0437\u0435\u0440\u0432: \u0443 \u0431\u0438\u0442\u0432\u0456 \u043D\u0435 \u0431\u0435\u0440\u0443\u0442\u044C \u0443\u0447\u0430\u0441\u0442\u0456, \u0430\u043B\u0435 \u0434\u0430\u044E\u0442\u044C \u043E\u0447\u043A\u0438.
